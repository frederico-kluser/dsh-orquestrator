# =============================================================================
# OpenSSF Scorecard — dsh-orquestrator (frederico-kluser/dsh-orquestrator)
#
# Continuous supply-chain analysis; results are published to
# https://securityscorecards.dev (publish_results: true) and uploaded as a SARIF
# artifact for review. All actions are pinned by commit SHA (owner/repo@<sha> # vX).
# =============================================================================

name: OpenSSF Scorecard

on:
  branch_protection_rule:   # re-avaliar quando os rulesets mudarem
  schedule:
    - cron: "30 5 * * 1"    # semanalmente, segunda-feira às 05:30 UTC
  push:
    branches:
      - "main"

# Privilégio mínimo global; cada job declara a elevação pontual de que precisa.
permissions: read-all

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write  # gravar SARIF em code scanning
      id-token: write         # OIDC para publicar resultados assinados
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SARIF file
          path: results.sarif
