# dsh-orquestrator bundle layer. Applied automatically to any composition that
# installs this package as a bundle (`dsh plugin --profile web add <path>`).
#
# The plugin ships INERT until the user confirms the modal on a task: no session
# is governed by default and cancelling the modal keeps the stock DSH behavior.
#
# Deployment defaults (headless runs, a server-wide default choice) ride in
# through DSH_ORQUESTRATOR_CONFIG: a JSON object validated by the plugin's own
# Config schema, e.g.
#
#   export DSH_ORQUESTRATOR_CONFIG='{"defaults":{"subagentModel":{"provider":"openrouter","model":"google/gemini-3.8-flash"},"workerEffort":"medium"}}'
#
# The variable exists because a profile patch layer cannot reach this row on DSH
# 0.2.x: the row is inserted by this bundle patch, and an id-targeted patch in
# $DSH_HOME/profiles/<profile>/cordis.patch.yml resolves to nothing (verified on
# dsh 0.2.1-rc.2), so the documented "restate the whole entry" recipe cannot
# carry `config` there. Without the variable the row stays exactly as inert as
# before.
#
# Options (README, "Which delegations are covered"):
#   children: { explicitModel: keep }   # a model a workflow script names itself stands
#   children: false                     # switch the enforcement off
- insert:
    - id: orquestrator
      name: "./lib/index.js"
      config: !!js JSON.parse(process.env.DSH_ORQUESTRATOR_CONFIG ?? "{}")
